{% extends "base2.html" %}
{% load static %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <h2>Adicionar E-mail</h2>
        <p class="text-muted">Use um e-mail válido. Você receberá um link para confirmação.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}
            {{ form.email }}

            <button type="submit" class="btn btn-success mt-3">Enviar confirmação</button>
            <a href="{% url 'ver_perfil' %}" class="btn btn-secondary mt-3">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
